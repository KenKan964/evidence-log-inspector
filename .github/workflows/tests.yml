name: acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          ELI_EVIDENCE: ci-evidence
      - run: python eli.py --log samples/normal.jsonl --policy samples/policy.json --out ci-normal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ci-evidence/
            ci-normal/
